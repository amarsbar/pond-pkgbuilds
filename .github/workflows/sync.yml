name: Sync CachyOS packages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cachyos-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Pond
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch CachyOS upstreams
        run: |
          git remote add cachyos https://github.com/CachyOS/CachyOS-PKGBUILDS.git
          git fetch --no-tags cachyos master
          git remote add cachyos-kernels https://github.com/CachyOS/linux-cachyos.git
          git fetch --no-tags cachyos-kernels master

      - name: Open PKGBUILD sync pull requests
        env:
          POND_BRANCH: main
          POND_UPSTREAM_REPOSITORY: CachyOS/CachyOS-PKGBUILDS
          POND_PACKAGE_MAP: .github/cachyos-packages.tsv
        run: .github/scripts/sync-upstream.sh refs/remotes/cachyos/master

      - name: Open kernel sync pull requests
        env:
          POND_BRANCH: main
          POND_UPSTREAM_REPOSITORY: CachyOS/linux-cachyos
          POND_PACKAGE_MAP: .github/linux-cachyos-packages.tsv
        run: .github/scripts/sync-upstream.sh refs/remotes/cachyos-kernels/master
