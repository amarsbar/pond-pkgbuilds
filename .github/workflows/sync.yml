name: Sync CachyOS packages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cachyos-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_URL: https://github.com/CachyOS/CachyOS-PKGBUILDS.git

    steps:
      - name: Check out Pond
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch CachyOS
        run: |
          git remote add cachyos "$UPSTREAM_URL"
          git fetch --no-tags cachyos master

      - name: Open package sync pull requests
        env:
          POND_BRANCH: main
        run: .github/scripts/sync-upstream.sh refs/remotes/cachyos/master
